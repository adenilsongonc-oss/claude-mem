<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Atlas Selvagem</title>
  <meta name="description" content="Atlas Selvagem — caderno de expedições: registre, mapeie e analise suas trilhas. Funciona offline; seus dados ficam no aparelho e podem ser exportados.">
  <meta name="theme-color" content="#F8F6EF">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icones/icone.svg" type="image/svg+xml">
  <link rel="icon" href="icones/icone-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Atlas">
  <link rel="preload" href="fontes/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fontes/im-fell-english-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/estilo.css">
  <script>
    // Aplica o tema antes da pintura para evitar clarão.
    try { var t = JSON.parse(localStorage.getItem('atlas-selvagem:prefs') || '{}').tema; if (t === 'claro' || t === 'escuro') document.documentElement.dataset.tema = t; } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  <div class="app">
    <header class="cabecalho">
      <a class="marca" href="#/atlas" aria-label="Atlas Selvagem — início">
        <span id="marca-simbolo"></span>
        <span><span class="marca__nome">Atlas Selvagem</span><span class="marca__sub">Caderno de expedições</span></span>
      </a>
      <div class="cabecalho__acoes">
        <button class="botao-icone" id="alternar-tema" type="button" aria-label="Alternar tema"></button>
        <a class="botao-icone" href="#/arquivo" aria-label="Arquivo e configurações" id="atalho-config"></a>
      </div>
    </header>
    <nav class="nav" aria-label="Navegação principal" id="nav"></nav>
    <div>
      <div class="faixas" id="faixas" aria-live="polite"></div>
      <main class="conteudo" id="conteudo" tabindex="-1">
        <noscript><p>O Atlas Selvagem precisa de JavaScript para funcionar.</p></noscript>
        <p class="sutil">Abrindo o atlas…</p>
      </main>
    </div>
  </div>
  <div class="avisos" id="avisos"></div>
</body>
</html>
