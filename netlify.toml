# Publicação do Atlas Selvagem no Netlify a partir do GitHub.
# A configuração fica na raiz do repositório: deixe o campo "Base directory" VAZIO no painel do Netlify.
[build]
  base = "atlas-selvagem"
  command = "node scripts/verificar.mjs && node scripts/montar-site.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# O service worker e a página precisam ser revalidados sempre, senão o navegador demora a ver versões novas.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
